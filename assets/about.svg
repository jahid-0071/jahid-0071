<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090C12"/>
      <stop offset="100%" stop-color="#10151E"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="fadeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="-20" x2="0" y2="240">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="-20" width="1000" height="260">
      <rect x="0" y="-20" width="1000" height="260" fill="url(#fadeGrad)"/>
    </mask>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; }

      /* Title bar (upore) */
      .title { font-size: 18px; font-weight: bold; fill: #E8ECF4; }
      .menu  { font-size: 16px; fill: #9AA7BD; }
      .live  { font-size: 16px; fill: #00E5FF; }

      /* ===== SYSTEM ONLINE theke niche: SHOB 26px ===== */
      .t26     { font-size: 26px; }
      .status  { fill: #34D399; }
      .profile { fill: #94A3B8; }
      .tagline { fill: #00E5FF; }
      .prompt  { stroke: #090C12; stroke-width: 5px; paint-order: stroke; }
      .command { font-weight: bold; fill: #5FFF87; stroke: #090C12; stroke-width: 5px; paint-order: stroke; }
      .output  { fill: #FFFFFF; stroke: #090C12; stroke-width: 5px; paint-order: stroke; }

      .line { opacity: 0; animation: appear .5s ease forwards; }
      @keyframes appear { to { opacity: 1; } }

      .cursor { animation: blink .8s steps(2, start) infinite; }
      @keyframes blink { to { opacity: 0; } }

      .scan { animation: scan 5s ease-in-out infinite; }
      @keyframes scan {
        0%,100% { transform: translateY(0); opacity: .12; }
        50%     { transform: translateY(900px); opacity: .45; }
      }

      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .4; } }

      /* ===== BINARY RAIN (beshi, ujjol) ===== */
      .rain { animation: fall linear infinite; }
      @keyframes fall { from { transform: translateY(-260px); } to { transform: translateY(1120px); } }
      .rn { font: 16px 'Courier New', Consolas, monospace; }
      .c { fill: #00E5FF; fill-opacity: .9; }
      .p { fill: #A78BFA; fill-opacity: .9; }
    </style>
    <clipPath id="rain-clip"><rect width="1000" height="1100" rx="16"/></clipPath>
    <clipPath id="type-clip">
      <rect x="46" y="118" width="0" height="32">
        <animate attributeName="width" values="0;870;870;0" keyTimes="0;0.5;0.92;1" dur="11s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

