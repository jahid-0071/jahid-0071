
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .command { fill: #00E5FF; font-size: 19px; font-weight: bold; }
      .output { fill: #E2E8F0; font-size: 17px; }
      .muted { fill: #94A3B8; font-size: 15px; }
      .accent { fill: #A78BFA; }
      .line {
        opacity: 0;
        animation: appear .5s ease forwards;
      }
      @keyframes appear {
        to { opacity: 1; }
      }
      .cursor {
        animation: blink .8s steps(2, start) infinite;
      }
      @keyframes blink {
        to { opacity: 0; }
      }
      .scan {
        animation: scan 4s ease-in-out infinite;
      }
      @keyframes scan {
        0%,100% { transform: translateY(0); opacity: .15; }
        50% { transform: translateY(590px); opacity: .65; }
      }
      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% { opacity: .4; }
      }
    </style>
  </defs>

  <!-- Terminal body -->
  <rect width="1000" height="720" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top bar -->
  <path d="M16 0 H984 Q1000 0 1000 16 V58 H0 V16 Q0 0 16 0" fill="#1E293B"/>
  <circle cx="27" cy="29" r="6" fill="#FB7185"/>
  <circle cx="49" cy="29" r="6" fill="#FBBF24"/>
  <circle cx="71" cy="29" r="6" fill="#34D399"/>
  <text x="95" y="35" class="mono" font-size="16" fill="#CBD5E1">jahid@developer-terminal: ~/about-me</text>
  <text x="965" y="35" text-anchor="end" class="mono" font-size="13" fill="#00E5FF">LIVE SESSION</text>

  <!-- Status -->
  <circle cx="31" cy="84" r="5" fill="#34D399" class="pulse"/>
  <text x="46" y="90" class="mono" font-size="14" fill="#34D399">SYSTEM ONLINE</text>
  <text x="970" y="90" text-anchor="end" class="mono muted">PROFILE: JAHID-0071</text>
  <path d="M25 105 H975" stroke="#334155"/>

  <!-- Whoami -->
  <g class="mono">
    <g class="line" style="animation-delay:.4s">
      <text x="32" y="140" class="command">$ whoami</text>
    </g>
    <g class="line" style="animation-delay:1.2s">
      <text x="55" y="174" class="output">Md. Jahid Hasan</text>
    </g>
    <g class="line" style="animation-delay:1.8s">
      <text x="55" y="201" class="output">Software Engineering Student</text>
    </g>
    <g class="line" style="animation-delay:2.4s">
      <text x="55" y="228" class="output">Competitive Programmer</text>
    </g>

    <!-- Focus -->
    <g class="line" style="animation-delay:3.2s">
      <text x="32" y="274" class="command">$ focus</text>
    </g>
    <g class="line" style="animation-delay:3.8s">
      <text x="55" y="308" class="output">Data Structures &amp; Algorithms</text>
    </g>
    <g class="line" style="animation-delay:4.4s">
      <text x="55" y="335" class="output">Problem Solving</text>
    </g>
    <g class="line" style="animation-delay:5s">
      <text x="55" y="362" class="output">Software Development</text>
    </g>

    <!-- Exploring -->
    <g class="line" style="animation-delay:5.8s">
      <text x="32" y="408" class="command">$ exploring</text>
    </g>
    <g class="line" style="animation-delay:6.4s">
      <text x="55" y="442" class="output">Artificial Intelligence</text>
    </g>
    <g class="line" style="animation-delay:7s">
      <text x="55" y="469" class="output">Machine Learning</text>
    </g>
    <g class="line" style="animation-delay:7.6s">
      <text x="55" y="496" class="output">Cybersecurity</text>
    </g>
    <g class="line" style="animation-delay:8.2s">
      <text x="55" y="523" class="output">Modern Technologies</text>
    </g>

    <!-- Mindset -->
    <g class="line" style="animation-delay:9s">
      <text x="32" y="569" class="command">$ mindset</text>
    </g>
    <g class="line" style="animation-delay:9.6s">
      <text x="55" y="603" class="output">Learn continuously.</text>
    </g>
    <g class="line" style="animation-delay:10.2s">
      <text x="55" y="630" class="output">Build meaningful things.</text>
    </g>
    <g class="line" style="animation-delay:10.8s">
      <text x="55" y="657" class="output">Improve every day.</text>
    </g>
    <g class="line" style="animation-delay:11.4s">
      <text x="32" y="694" class="command">$ <tspan class="cursor">_</tspan></text>
    </g>
  </g>

  <!-- Scan line -->
  <rect x="1" y="110" width="998" height="2" fill="url(#cyan)" filter="url(#glow)" class="scan" opacity=".35"/>

  <!-- Footer accent -->
  <path d="M25 710 H975" stroke="#334155"/>
</svg>
